# Authority tiers for search ranking.
#
# Order of authority (Dave, 2026-11-01): Bowen first; Kerr second and equal to Papero;
# all three above any other source.
#
# How the multiplier is used (spec E11 option b, since 2026-11-01): it divides a chunk's
# RANK, not its score. A chunk at raw rank r (1 = most relevant) with multiplier m is placed
# at r / m, so a 3.0x chunk at raw rank 30 ties an unboosted chunk at raw rank 10. The boost
# reorders comparable results; it cannot push the most relevant ones out of the results.
#
# Each entry has either `pattern` (case-insensitive substring of the document file name) or
# `regex` (case-insensitive Python regular expression searched in the name). The FIRST
# matching entry wins — order matters. Documents that match nothing get 1.0x.
# Multipliers must be >= 1.0.
#
# authority.py keeps a copy of this list (DEFAULT_TIERS) for the desktop bundle, which
# does not ship this file; test_authority.py fails if the two differ. Edit both.
# No index rebuild required — the boost is applied at query time; restart the app.

tiers:

  # ── Bowen (3.0x) ──────────────────────────────────────────────────────────
  - pattern: "Family Therapy in_Clinical_Practice_Chapter"
    multiplier: 3.0
    note: "Bowen, Family Therapy in Clinical Practice (1978), chapters"

  - pattern: "Bowen Basic Series Tape"
    multiplier: 3.0
    note: "Bowen lecture tapes"

  - pattern: "BOWEN-KERR INTERVIEW SERIES"
    multiplier: 3.0
    note: "Bowen interviewed by Kerr; Bowen is the speaker"

  - pattern: "Bowen on Triangles"
    multiplier: 3.0

  - pattern: "Psychotherapy Past Present Future"
    multiplier: 3.0
    note: "Bowen"

  - pattern: "Erosion of Theory"
    multiplier: 3.0
    note: "Bowen's 'The Erosion of Theory' (1988 paper + lecture transcript)"

  - pattern: "Erosion Letters"
    multiplier: 3.0
    note: "Bowen's 'The Erosion Letters' (1980-1989)"

  - pattern: "A Family Concept of Schizophrenia Bowen"
    multiplier: 3.0
    note: "Bowen 1960"

  - pattern: "Interview of Bowen by"
    multiplier: 3.0
    note: "Bowen interviewed (Ciervo)"

  - regex: "^(FSJ|Copy of) [\\d.]+\\.?\\s+(\\(\\d+\\)\\s+)?Bowen\\b"
    multiplier: 3.0
    note: "FSJ articles by Bowen ('FSJ 9.2 Bowen ...', 'FSJ 2.1 (1) Bowen ...')"


  # ── Kerr and Papero (2.0x) — Kerr is second to Bowen and equal to Papero ───
  - pattern: "Family Evaluation"
    multiplier: 2.0
    note: "Kerr & Bowen (1988); Kerr is the author of the text, Bowen wrote the epilogue"

  - pattern: "Bowen Theory Secrets"
    multiplier: 2.0
    note: "Kerr, Bowen Theory's Secrets (2019); was unboosted until 2026-11-01"

  - pattern: "Chronic Anxiety and Defining"
    multiplier: 2.0
    note: "Kerr Atlantic article"

  - pattern: "Cancer and the Emotional System"
    multiplier: 2.0
    note: "Kerr"

  - pattern: "Family and Society Kerr"
    multiplier: 2.0

  - pattern: "Family as a System Kerr"
    multiplier: 2.0

  - pattern: "Family Systems and Therapy Kerr"
    multiplier: 2.0

  - pattern: "Physical Illness as the Family Emotional"
    multiplier: 2.0
    note: "Kerr"

  - pattern: "- Michael Kerr -"
    multiplier: 2.0
    note: "Kerr lectures and interviews (file names '... - Michael Kerr - date')"

  - regex: "^(FSJ|Copy of) [\\d.]+\\.?\\s+(\\(\\d+\\)\\s+)?Kerr\\b"
    multiplier: 2.0
    note: "FSJ articles and editorials by Kerr ('FSJ 4.2 Kerr ...')"

  - pattern: "Bowen Family Systems Theory_"
    multiplier: 2.0
    note: "Papero, Bowen Family Systems Theory (1990), chapters"

  - pattern: "Papero"
    multiplier: 2.0
    note: "Papero, including his FSJ articles"


  # ── Family Systems Journal & Family Center Reports (1.3x) ─────────────────
  - pattern: "FSJ "
    multiplier: 1.3
    note: "FSJ articles by other authors"

  - pattern: "Copy of "
    multiplier: 1.3
    note: "FSJ article PDFs (legacy naming)"

  - pattern: "Family Center Reports"
    multiplier: 1.3


  # ── Other named theorists (1.15x) ─────────────────────────────────────────
  - pattern: "Friedman"
    multiplier: 1.15

  - pattern: "Fogarty"
    multiplier: 1.15

  - pattern: "Guerin"
    multiplier: 1.15

  - pattern: "Toman"
    multiplier: 1.15

  - pattern: "Gilbert"
    multiplier: 1.15

  - pattern: "Harrison"
    multiplier: 1.15

  # Everything else scores at 1.0x (no entry needed)
