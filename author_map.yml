# Author map — maps document filename patterns to author names.
#
# Patterns are matched case-insensitively as substrings of the document filename.
# The FIRST matching pattern wins — order matters (specific before general).
# Documents that match no pattern are labelled "Unknown".
#
# To add a new author: copy any entry, change pattern and author, restart the app.
# No index rebuild required.

authors:

  # ── Your articles ────────────────────────────────────────────────────────
  - pattern: "Galloway"
    author: "Dave Galloway"

  # ── Michael Kerr's book "Bowen Theory's Secrets" (filenames start "Bowen Theory ...") ─
  # Must come before the bare "Bowen" catch-all, which would credit Murray Bowen.
  - pattern: "Bowen Theory Secrets"
    author: "Michael Kerr"

  # ── Transcripts with explicit "- Author Name -" format ───────────────────
  - pattern: "Kathleen Kerr"
    author: "Kathleen Kerr"

  - pattern: "Michael Kerr"
    author: "Michael Kerr"

  # ── FSJ / other articles by other authors whose TITLE contains "Bowen" ────
  # These must come before the bare "Bowen" catch-all below, which would otherwise
  # credit Murray Bowen with them. The author is the surname in the filename.
  - pattern: "FSJ 10.2 Jones"
    author: "Jones"

  - pattern: "FSJ 12.1 Riordan"
    author: "Riordan"

  - pattern: "FSJ 13.2 Harrison"
    author: "Harrison"

  - pattern: "FSJ 17.1 Ferrera"
    author: "Ferrera"

  - pattern: "FSJ 18.2 McKnight"
    author: "McKnight"

  - pattern: "FSJ 18.2 Millikin"
    author: "Millikin"

  - pattern: "FSJ 3.1 (3) Holt"
    author: "Holt"

  - pattern: "FSJ 5.1 Caskie"
    author: "Caskie"

  - pattern: "FSJ 9.1 Thompson"
    author: "Thompson"

  - pattern: "Lerner 1985"
    author: "Lerner"

  # ── Bowen–Kerr joint works (before individual Bowen/Kerr catches) ─────────
  - pattern: "BOWEN-KERR INTERVIEW SERIES"
    author: "Bowen & Kerr"

  - pattern: "Family Evaluation"
    author: "Kerr & Bowen"

  # A Bowen lecture whose file name starts like Papero's book; its own header says
  # "Presenter: Murray Bowen".
  - pattern: "Bowen Family Systems Theory_ Triangles and Scale of Differentiation"
    author: "Murray Bowen"

  # ── Papero works (before "Bowen" catches Papero's book title) ────────────
  - pattern: "Bowen Family Systems Theory"
    author: "Daniel Papero"

  - pattern: "Papero"
    author: "Daniel Papero"

  - pattern: "Family Systems Therapy Papero"
    author: "Daniel Papero"

  # ── Primary Bowen works ───────────────────────────────────────────────────
  - pattern: "Family Therapy in_Clinical_Practice"
    author: "Murray Bowen"

  - pattern: "Bowen Basic Series Tape"
    author: "Murray Bowen"

  - pattern: "Bowen on Triangles"
    author: "Murray Bowen"

  - pattern: "Psychotherapy Past Present Future"
    author: "Murray Bowen"

  # "Wisdom of the Ages" files are conference-recording transcripts, NOT Bowen's own
  # words, and the speakers are not recorded in the filenames, so they have no entry
  # here and are labelled "Unknown" until someone records the speakers.

  - pattern: "A Family Concept of Schizophrenia Bowen"
    author: "Murray Bowen"

  - pattern: "Parents should not present a united front"
    author: "Murray Bowen"

  - pattern: "Two Distinct Approaches"
    author: "Murray Bowen"

  # ── Primary Kerr works (named Kerr in title but not "Kathleen/Michael") ───
  - pattern: "Cancer and the Emotional System"
    author: "Michael Kerr"

  - pattern: "Chronic Anxiety and Defining"
    author: "Michael Kerr"

  - pattern: "Family and Society Kerr"
    author: "Michael Kerr"

  - pattern: "Family as a System Kerr"
    author: "Michael Kerr"

  - pattern: "Family Systems and Therapy Kerr"
    author: "Michael Kerr"

  - pattern: "Physical Illness as the Family Emotional"
    author: "Michael Kerr"

  - pattern: "Kerr"
    author: "Michael Kerr"

  # ── Other named theorists ─────────────────────────────────────────────────
  - pattern: "Fogarty"
    author: "Thomas Fogarty"

  - pattern: "Fogerty"
    author: "Thomas Fogarty"

  - pattern: "Friedman"
    author: "Edwin Friedman"

  - pattern: "Guerin"
    author: "Philip Guerin"

  - pattern: "Toman"
    author: "Walter Toman"

  - pattern: "Bowen"
    author: "Murray Bowen"

  # ── Others with author-in-filename ───────────────────────────────────────
  - pattern: "Heller"
    author: "Heller"

  # Surnames read from OCR'd scans' file names (family name only, as in the name).
  - pattern: "Crowding and Social Velocity Calhoun"
    author: "Calhoun"
  - pattern: "Modificaiton of Loss in Divorce Cristofori"
    author: "Cristofori"
  - pattern: "Tansgenerational Family Therapy Lieberman"
    author: "Lieberman"
  - pattern: "Family Systems Therapy Cain"
    author: "Cain"
  - pattern: "Reflections on 1 year in Family Therapy Morris"
    author: "Morris"
  - pattern: "Treating Conduct Disordered Adolescents Roberts"
    author: "Roberts"
  - pattern: "FSJ 5.2 (1) Smith"
    author: "Smith"

  - pattern: "Noone"
    author: "Noone"

  - pattern: "Beal"
    author: "Beal"

  - pattern: "Freeman"
    author: "Freeman"

  - pattern: "Carter"
    author: "Carter"

  - pattern: "Richardson"
    author: "Richardson"

  - pattern: "Gilbert"
    author: "Gilbert"

  - pattern: "Lorio"
    author: "Lorio"

  # Everything else → "Unknown" (no entry needed, handled in code)
