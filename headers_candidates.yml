  author: Roberta B. Holt, DSW This clinical case report is based on a presentation at a Faculty Case
    Conference in November 1994. Identifying data including the family sur­ name have been altered to
    insure confidentiality. This case was presented to summarize emotional processes within a family and
    stimulate thinking about the ongoing course of the con-sultation. The presentation was selected as
    an example of the applicability of Bowen theory to a poor family with multiple problems. Bowen theory
    is grounded in biology and applies to all humanity. In spite of its inclusive­ ness it has been overlooked
    and underutilized as relevant in thinking about the most intense human problems that come to the attention
    of public social service agencies. PRESENTING PROBLEM This case was a referral in my work in a county
    welfare child protective unit. The family had been on welfare and the mother was participating in
    a project designed to train clients for self-sufficiency as part of the larger goal of reducing welfare
    rolls. In addition to poverty, the family had experienced problems with family discord, alcohol abuse,
    violence, and child abuse. They had come to the at­ tention of the child protective unit of social
    services when the fifteen year old daughter accused her mother's live-in mate of sexual abuse. In
    processing these allegations, he had been sent to jail while await­ ing trial. The fifteen year old
    daughter had been referred to a sexual abuse treatment program. Subsequently the mother was referred
    to me to lend a hand to the family as it dealt with the multiple issues it faced. The presentation
    is designed to focus not on the child sexual abuse but on the emotional process in the family system
    and on the interplay between family variables and progress in a mandatory state Faculty Case Conference
    © Georgetown Family Center, 1995 62 program designed to assist individuals off welfare rolls. A consid­
    eration of family process provides the background
  year: '1994'
