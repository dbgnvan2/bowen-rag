- doc_name: FSJ 8.2 (5) Murphy 163-176
  verified: false
  header_excerpt: Vol.8, No. 2 Faculty Case Conference 163 The faculty case conference is held twice monthly
    at the Georgetown Family Center. Faculty members take tur
  source: header
  author: 'Douglas C. Murphy, MA This clinical case is based on a presentation at the Faculty Case Conference
    in November 2009. Identifying data, including family surnames, have been altered to insure confidentiality.
    This case was presented to summarize and consider the emotional process within a three-generation
    family. This presentation was selected as an example of the context that Bowen theory offers for understanding
    the challenges faced by an individual with multiple functional difficulties (substance abuse, chronic
    physical problems, and chronic pain) within the family emotional system in which they are embedded.
    PRESENTING PROBLEM T his case was referred to my private practice from a pain management clinic at
    a local hospital. I have seen a number of such referrals, whose chronic pain the referral source considers
    to be exacerbated by relationship difficulties. Usually these referrals come for only a few appointments
    until it becomes clear that what they are seeking is further strategies for managing pain and not
    ways to address their relationship difficulties. This referral was unusual in that Ms. Moore, the
    client, continued to consult with me for nine months. This was due to several factors: (1) counseling
    was a con­ dition for continued financial support from the client’s parents, (2) because the consultations
    were being paid for by the parents and, (3) because the client had some appreciation that her relationships
    with her son, her parents, and her husband posed problems for her. FACULTY CASE CONFERENCE 163 Mr.
    Murphy is the director of the Family Crisis Center in Baltimore, Maryland and has been on the faculty
    of the Georgetown Family Center since 1992. © Georgetown Family Center, 2011. 164 Family Systems 2011
    Ms. Moore had attended the pain management clinic to find methods to manage the pain she was experiencing
    and to be detoxi­ fied from vicodin and other pain medications. These medications had initially been
    prescribed to address the pain associated with her multiple sclerosis, which had been diagnosed in
    May 2005. Her therapeutic use had quickly turned into abusing these drugs. She also had a history
    of methamphetamine and alcohol abuse. As part of her management plan, she had agreed to attend an
    intensive day treatment program to address her abuse of alcohol, pain medication, and methamphetamine,
    and to seek psychotherapy to begin to ad­ dress her relationship difficulties. In conjunction with
    her alcohol and drug abuse, Ms. Moore was facing other difficulties. Her husband, Mr. Moore, from
    whom she is currently separated, also has a long history of abusing vicodin and methamphetamine. At
    the time of Ms. Moore’s initial consultation with me, Mr. Moore was enrolled in a residential rehabilitation
    pro­ gram in a neighboring state. Ms. Moore paid for his treatment there. Ms. Moore was anxious about
    his recovery and about his return to her and their ten-year-old son. Ms. Moore also reported difficulties
    with her son. The son had been in therapy to address his difficulty with being away from her and her
    difficulty in establishing appropriate boundaries with him. This has resulted in his reluctance to
    sleep in his own bed, regularly attend school, or form relationships with children his own age. Ms.
    Moore was also concerned about her relationship with her parents. The parents had agreed to support
    her and her son finan­ cially with the condition that she remain in treatment, remain drug free, and
    remain separated from her husband. Ms. Moore saw this as their continued interference in her life,
    but she had acquiesced because of her multiple sclerosis and pain, her drug addiction, and her inability
    to support herself and her son. Ms. Moore had been the recipient of a substantial inheritance in 1996,
    which she admitted that she had squandered during the past twelve years. She was anticipating another
    portion of this inheritance which had been put in a trust for her. She believed that if she didn’t
    attempt to get off drugs and get her life back on track her parents would take action to halt the
    distribution of money from the trust. NUCLEAR FAMILY HISTORY Ms. Moore met Mr. Moore in 1990 in Maryland.
    Ms. Moore had dropped out of high school and was getting her G.E.D. Both of'
  year: '2009'
  year_source: header
