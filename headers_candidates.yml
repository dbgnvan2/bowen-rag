  source: header
  author: Douglas C. Murphy, MA This clinical case report is based on a presentation at a Faculty Case
    Conference in April 1996. Identifying data has been altered to protect confidentiality. The main purpose
    of the presentation was to discuss a specific outcome of processes in emotional systems; murder/suicide,
    and its occurrence and ramifications for one family from the perspective of Bowen family systems theory.
    The clinical presentation represents a beginning effort with the fam­ ily. The factual data collected
    thus far is incomplete and should be considered preliminary. However, the disadvantage of presenting
    a case with a scarcity of facts was outweighed by the opportunity to formulate ideas and engage in
    a discussion with faculty members about the manifestation of murder/suicide in family emotional systems.
    PRESENTING PROBLEM Mrs. W began consulting with me in January of 1996 about the violent behavior of
    her nephew who was currently living with her and her husband. At that time, her nephew, Mr. B, was
    in court ordered group therapy as a condition of his probation due to a vio­ lent incident with his
    former girlfriend. Mrs. W was concerned that her nephew was beginning to exhibit a pattern of violent
    behavior similar to his father, Mrs. W’s younger brother, which had ended in the father murdering
    his wife, Mr. B’s mother, and then taking his own life. Mrs. W asked that I consult to her nephew
    and her around her concerns and his behavior as soon as he completed his court ordered treatment.
    In his initial appointment in February 1996 Mr. B reported that he had been involved in a relationship
    with his girlfriend for several months until she broke it off in the summer of 1995. This breakup
    Faculty Case Conference © Georgetown Family Center, 1996 69 70 Family Systems Spring/Summer 1996 had
    upset him and he tried to contact her to see if they could get back together. Several members of her
    family blocked his repeated efforts at contacting her. He eventually became frustrated and responded
    by standing across the street from the woman's home, yelling threats at her and the other family members.
    He was arrested, spent a night in jail, and was later convicted of threatening bodily harm and stalk­
    ing. He received three years supervised probation and was ordered into group treatment for batterers.
    In subsequent consultations Mrs. W elaborated on her nephew’s account of the incident, reporting that
    Mr. B was wearing a ski mask and wielding a hatchet as he stood on the opposite side of the street
    from the girlfriend’s house. She also stated that he had allegedly threatened to blow the girlfriend’s
    car up in a prior conversation that he had with her over the phone. Mr. B denied the car bombing threat,
    explaining it as something the family had made up to insure that he would be found guilty. When asked
    about the ski mask and hatchet, he stated that he had unconsciously grabbed them as he was leaving
    to go to his girlfriend’s house. Mrs. W worried that her nephew would get into trouble in relationships
    again. She reported that Mr. B had had difficulties in a previous relationship which began after his
    graduation from high school. At that time he had received his inheritance from his parents’ estate.
    He proceeded to move into the family home of this previous girlfriend and promptly spent the inheritance
    on her and her family. When the money was gone the girlfriend threw him out. He then threatened this
    girlfriend verbally. Mr. B acknowledged his difficulties with relationships. He stated that he knew
    he had problems with his anger and wanted to see if he could deal with it better in the future. NUCLEAR
    FAMILY HISTORY Mr. B is the oldest of two children. His parents were married in 1973. Prior to the
    marriage Mr. B’s father had one other child, a daughter. His father did not marry this daughter’s
    mother but did provide financial support and had contact with her during her childhood. Both of Mr.
    B’s parents were working in a factory when they met. His mother stopped working for a brief period
    of time after Mr. B's birth in 1975 and then returned to work until Mr. B’s younger sister was born
    in 1978. Both children were cared for by their maternal grandmother when their mother returned to
    work in 1979. In 1987 Mr. B’s father murdered his wife and then committed suicide. He was forty-three
    years old at the time and she was thirty-
  year: '1996'
