# Known Bowen terms and the minimum number of documents that must contain each one.
# Spec: docs/spec_exact_match_search_v2.md#E12. Tests: test_known_terms.py.
#
# Seeded 2026-11-01 from review_2026-11-01/measure_literal.output.txt (index of 14,083
# chunks). measured_docs = documents containing the term in substring mode (case-
# insensitive, so 'nodal event' also counts 'nodal events'). min_docs = floor(0.9 x
# measured_docs), so a small corpus edit does not fail the test; a larger drop does.
# A term with max_docs must occur in at most that many documents (negative case).
# Add a term: run idx.exact_presence(term, mode='substring')['doc_count'] on the
# shipped index and enter that count with min_docs = floor(0.9 x count).
